name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wheels:
    name: native wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Rust targets for the universal2 macOS wheel
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: python -m pip install "cibuildwheel>=3,<4"
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: universal2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pure-wheel-and-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      # Fallback wheel for platforms without a native one
      - run: python -m build --wheel
        env:
          DSTATS_PURE_PYTHON: "1"
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: pure-and-sdist
          path: dist/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities in the Rust dependency tree (RustSec advisory DB)
      - run: cargo audit
        working-directory: rust

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-wheels, pure-wheel-and-sdist, audit]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Also uploads build provenance attestations for every file
      - uses: pypa/gh-action-pypi-publish@release/v1
