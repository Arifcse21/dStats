[build-system]
requires = ["setuptools>=84.1.0", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "dStats"
version = "1.0.8"
description = "A real-time web-based monitoring tool that provides performance stats for Docker containers and visualizes their network connectivity graph"
readme = "README_pypi.md"
license = {text = "MIT License"}
authors = [
    {name = "Abdullah Al Arif", email = "arifcse21@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12.3"
# Minimums are the first releases without known vulnerabilities (pip-audit)
dependencies = [
    "Django>=6.1.2",
    "graphviz>=0.21",
    "docker>=7.2.0",
    "daphne>=4.2.3",
    "requests>=2.33.0",
    "python-decouple>=3.8",
    # Not used directly, but pulled in through daphne and Django: raise their
    # minimums so upgrading dStats also replaces vulnerable installed copies
    "Twisted>=26.10.0",
    "sqlparse>=0.6.0",
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "ujson>=5.13.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "uv>=0.2",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Arifcse21/dStats"
Repository = "https://github.com/Arifcse21/dStats"

# console script entry point
[project.scripts]
"dStats.server" = "dStats.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dStats*", "authboot*"]

[tool.setuptools.package-data]
dStats = ["**/*.py", "**/*.txt", "**/*.md", "**/*.html", "**/*.css", "**/*.js", "**/*.in", "LICENSE"]
[tool.cibuildwheel]
# The extension uses the stable ABI (abi3), so one cp312 build per platform covers Python 3.12+
build = "cp312-*"
skip = "*-win32 *_i686"
test-command = "python -c \"import dStats._rust\""

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
